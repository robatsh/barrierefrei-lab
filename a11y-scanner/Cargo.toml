[workspace]
members = ["crates/engine", "crates/cli", "desktop/src-tauri"]
default-members = ["crates/engine", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
